# /etc/nginx/sites-available/vihea   (replace attendance.yourdomain.com, then run certbot for HTTPS)
server {
  server_name attendance.yourdomain.com;
  root /var/www/vihea/frontend/dist;
  index index.html;
  client_max_body_size 8M;                       # selfie / leave attachments

  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;                   # the app checks this for the office WiFi rule
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}
